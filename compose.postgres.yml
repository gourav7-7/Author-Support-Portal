# Combine with compose.yml. The PostgreSQL port is intentionally not exposed.
services:
  web:
    environment:
      DATABASE_URL: postgresql+psycopg://authorcare:${POSTGRES_PASSWORD:-authorcare-local-only}@db:5432/authorcare
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authorcare
      POSTGRES_DB: authorcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authorcare-local-only}
    volumes:
      - authorcare-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authorcare -d authorcare"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  authorcare-postgres:
