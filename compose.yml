services:
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/runtime/authorcare.db}
      FRONTEND_DIST: /app/frontend/dist
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - authorcare-data:/app/runtime
    restart: unless-stopped
volumes:
  authorcare-data:
